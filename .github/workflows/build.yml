name: Build iOS App

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify project generation
        run: |
          xcodegen --version
          xcodegen generate
          ls -la CalorieTracker.xcodeproj

      - name: Build app for iOS device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project CalorieTracker.xcodeproj \
            -scheme CalorieTracker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED="NO" \
            CODE_SIGNING_ALLOWED="NO" \
            ENABLE_BITCODE="NO" \
            ONLY_ACTIVE_ARCH="NO" \
            2>&1 | tee build.log

      - name: Show build errors if any
        if: failure()
        run: grep -E "error:|warning: .*never used|BUILD FAILED" build.log | head -100 || true

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/CalorieTracker.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App bundle not found at $APP_PATH"
            exit 1
          fi

          rm -rf payload
          mkdir -p payload/Payload
          cp -r "$APP_PATH" payload/Payload/

          mkdir -p artifacts
          cd payload
          zip -qry ../artifacts/CalorieTracker-unsigned.ipa Payload
          cd ..

          echo "--- IPA contents ---"
          unzip -l artifacts/CalorieTracker-unsigned.ipa | head -40
          echo "--- Binary architecture ---"
          lipo -info payload/Payload/CalorieTracker.app/CalorieTracker

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CalorieTracker-unsigned-ipa
          path: artifacts/CalorieTracker-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CalorieTracker-build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore